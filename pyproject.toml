[project]
name = "deepagent-microsandbox"
version = "0.2.2"
description = "Desktop deep agent with microsandbox isolation and OpenRouter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "deepagents>=0.6.12",
    "fastapi>=0.139.0",
    "langchain>=1.3.12",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.4",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "microsandbox>=0.6.6",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
