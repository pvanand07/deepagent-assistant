services:
  deepagent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BWRAP_SETUID: "0"
    stdin_open: true
    tty: true
    environment:
      DEEPAGENT_WORKDIR: /workspace
      CODEX_GUI_WORKSPACE: /workspace
      DEEPAGENT_NETWORK_ACCESS: ${DEEPAGENT_NETWORK_ACCESS:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4.5}
      OPENROUTER_TEMPERATURE: ${OPENROUTER_TEMPERATURE:-0.3}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost}
      OPENROUTER_SITE_NAME: ${OPENROUTER_SITE_NAME:-deep-agent-bwrap}
      IRESEARCHER_MCP_URL: ${IRESEARCHER_MCP_URL:-https://iresearcher-mcp.elevatics.site/mcp}
      IRESEARCHER_MCP_BEARER_TOKEN: ${IRESEARCHER_MCP_BEARER_TOKEN:-}
    volumes:
      - ./workspace:/workspace
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BWRAP_SETUID: "0"
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8010"]
    ports:
      - "8010:8010"
    environment:
      DEEPAGENT_WORKDIR: /workspace
      CODEX_GUI_WORKSPACE: /workspace
      DEEPAGENT_NETWORK_ACCESS: ${DEEPAGENT_NETWORK_ACCESS:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4.5}
      OPENROUTER_TEMPERATURE: ${OPENROUTER_TEMPERATURE:-0.3}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost}
      OPENROUTER_SITE_NAME: ${OPENROUTER_SITE_NAME:-deep-agent-bwrap}
      IRESEARCHER_MCP_URL: ${IRESEARCHER_MCP_URL:-https://iresearcher-mcp.elevatics.site/mcp}
      IRESEARCHER_MCP_BEARER_TOKEN: ${IRESEARCHER_MCP_BEARER_TOKEN:-}
    volumes:
      - ./workspace:/workspace
      - ./frontend:/app/frontend
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    restart: "no"
