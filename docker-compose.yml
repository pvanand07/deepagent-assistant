services:
  # Single service now -- the CLI is gone (cli.py was deleted in the
  # run-based redesign; the API is the only entrypoint).
  #
  # Operational notes for the run architecture:
  # - Exactly ONE uvicorn process (never --workers): active runs, SSE
  #   subscriber queues, and SQLite live in-process.
  # - Runs survive client disconnects but not container death. On SIGTERM
  #   the lifespan hook cancels in-flight runs and rolls their checkpoints
  #   back; stop_grace_period gives that time to finish. If the container
  #   is killed hard instead, startup marks those runs `interrupted` and
  #   rolls them back lazily before the session's next run.
  # - ./data persists app.sqlite (sessions/runs/event log) + checkpoints.sqlite,
  #   so chat history and run logs survive restarts. The old data/sessions.json
  #   is no longer read and can be removed.
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BWRAP_SETUID: "0"
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8010"]
    ports:
      - "8011:8010"
    environment:
      DEEPAGENT_WORKDIR: /workspace
      CODEX_GUI_WORKSPACE: /workspace
      DEEPAGENT_NETWORK_ACCESS: ${DEEPAGENT_NETWORK_ACCESS:-false}
      DEEPAGENT_MAX_CONCURRENT_RUNS: ${DEEPAGENT_MAX_CONCURRENT_RUNS:-8}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4.5}
      OPENROUTER_TEMPERATURE: ${OPENROUTER_TEMPERATURE:-0.3}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost}
      OPENROUTER_SITE_NAME: ${OPENROUTER_SITE_NAME:-deep-agent-bwrap}
      IRESEARCHER_MCP_URL: ${IRESEARCHER_MCP_URL:-https://iresearcher-mcp.elevatics.site/mcp}
      IRESEARCHER_MCP_BEARER_TOKEN: ${IRESEARCHER_MCP_BEARER_TOKEN:-}
      DEEPAGENT_DATA_DIR: /app/data
    volumes:
      - ./workspace:/workspace
      - ./data:/app/data
      - ./frontend:/app/frontend
      - ./src:/app/src
      - ./agents:/app/agents
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8010/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3