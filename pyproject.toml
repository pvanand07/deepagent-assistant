[project]
name = "deepagent-assistant"
version = "0.1.0"
description = "Sandboxed deep agent web app (bubblewrap + OpenRouter)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "deepagents>=0.6.0",
    "fastapi>=0.115.0",
    "langchain>=0.3.0",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.6.4",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
